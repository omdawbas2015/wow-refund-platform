# Build the v2 production image and push to GitHub Container Registry
# (GHCR). Triggers on every push to a non-main branch and on tag push.
# The K8s Deployment in v2/k8s/base/web/deployment.yaml references
#   ghcr.io/omdawbas2015/wow-refund-platform:latest
# so once this workflow has run at least once the manifests are
# applyable as-is.
#
# Auth: uses the workflow's automatic GITHUB_TOKEN (no PAT needed).
# The repo's package permission settings must allow GITHUB_TOKEN to
# write packages — Settings → Actions → General → Workflow permissions
# → "Read and write permissions".

name: docker-build

on:
  push:
    branches:
      - 'devin/**'
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (sqlite for tests)
        working-directory: v2
        run: pnpm --filter @wow/db generate

      - name: Typecheck
        working-directory: v2
        run: pnpm typecheck

      - name: Unit tests
        working-directory: v2
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/devin/1777249813-continue-roadmap' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: v2
          file: v2/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
