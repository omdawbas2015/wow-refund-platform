# Local Postgres for testing the production schema.prisma provider
# without leaving the laptop. Default dev still uses SQLite via
# DATABASE_URL="file:./dev.db".
#
# Usage:
#   docker compose up -d postgres
#   DATABASE_URL=postgresql://wow:wow@localhost:5432/wow_refund pnpm db:migrate
#
# Stops cleanly with `docker compose down`. Data lives in the named
# volume `wow_postgres_data` so the schema persists across restarts.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wow-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: wow
      POSTGRES_PASSWORD: wow
      POSTGRES_DB: wow_refund
    volumes:
      - wow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wow -d wow_refund']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  wow_postgres_data:
