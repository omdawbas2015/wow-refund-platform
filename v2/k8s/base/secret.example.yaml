# EXAMPLE Secret — DO NOT apply this file directly with real values.
# Generate the production Secret with `kubectl create secret`:
#
#   kubectl -n wow-refund create secret generic wow-secrets \
#     --from-literal=DATABASE_URL='postgresql://wow:STRONG_PASSWORD@wow-postgres:5432/wow_refund?schema=public' \
#     --from-literal=DIRECT_DATABASE_URL='postgresql://wow:STRONG_PASSWORD@wow-postgres:5432/wow_refund?schema=public' \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=POWER_AUTOMATE_SIGNING_SECRET='shared-with-flow-trigger' \
#     --from-literal=CRON_SECRET="$(openssl rand -hex 24)" \
#     --from-literal=PII_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD='STRONG_PASSWORD' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or use a Sealed Secret / SOPS / external-secrets operator — anything
# that keeps the literals out of git.
apiVersion: v1
kind: Secret
metadata:
  name: wow-secrets
  namespace: wow-refund
  labels:
    app.kubernetes.io/name: wow-refund
type: Opaque
stringData:
  # Postgres connection — the StatefulSet uses POSTGRES_PASSWORD too.
  DATABASE_URL: 'postgresql://wow:REPLACE_ME@wow-postgres:5432/wow_refund?schema=public'
  DIRECT_DATABASE_URL: 'postgresql://wow:REPLACE_ME@wow-postgres:5432/wow_refund?schema=public'
  POSTGRES_PASSWORD: 'REPLACE_ME'
  # Auth.js
  AUTH_SECRET: 'REPLACE_ME_with_openssl_rand_base64_32'
  # Cron route signature
  CRON_SECRET: 'REPLACE_ME_with_openssl_rand_hex_24'
  # PII envelope encryption (Sprint F #20)
  PII_ENCRYPTION_KEY: 'REPLACE_ME_with_openssl_rand_hex_32'
  # Power Automate webhook signing (only required if M365 flows are live)
  POWER_AUTOMATE_SIGNING_SECRET: 'REPLACE_ME'
