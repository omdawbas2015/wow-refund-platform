# In-cluster CronJobs that hit the existing /api/cron/* route handlers.
# Each handler is idempotent and gated behind X-Cron-Secret (see
# v2/apps/web/src/lib/cron/auth.ts).
#
# Schedules mirror v2/vercel.json — keep these two files in sync if you
# ever deploy in parallel to both.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wow-cron-scheduled-reports
  namespace: wow-refund
  labels:
    app.kubernetes.io/name: wow-refund
    app.kubernetes.io/component: cron
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: wow-secrets
                      key: CRON_SECRET
              command: ['sh', '-c']
              args:
                - >
                  curl -fsS -m 600
                  -H "X-Cron-Secret: $CRON_SECRET"
                  http://wow-web/api/cron/scheduled-reports
---
