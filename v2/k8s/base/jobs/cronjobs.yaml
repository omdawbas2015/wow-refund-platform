# Nightly logical backup of Postgres → PVC. Pair this with an external
# rsync / s3-cp sidecar later if you want offsite copies.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wow-cron-postgres-backup
  namespace: wow-refund
  labels:
    app.kubernetes.io/name: wow-refund
    app.kubernetes.io/component: backup
spec:
  schedule: '0 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: postgres:16-alpine
              env:
                - name: PGUSER
                  value: wow
                - name: PGDATABASE
                  value: wow_refund
                - name: PGHOST
                  value: wow-postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wow-secrets
                      key: POSTGRES_PASSWORD
              command: ['sh', '-c']
              args:
                - >
                  set -e;
                  ts=$(date -u +%Y%m%dT%H%M%SZ);
                  pg_dump --format=custom --no-owner --no-acl
                  --file=/backups/wow_refund_$ts.dump &&
                  ls -lh /backups/wow_refund_$ts.dump &&
                  find /backups -name 'wow_refund_*.dump' -mtime +14 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: wow-postgres-backups
