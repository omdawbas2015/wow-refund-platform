apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply the namespace first; Kustomize handles ordering automatically.
namespace: wow-refund

commonLabels:
  app.kubernetes.io/name: wow-refund
  app.kubernetes.io/part-of: wow-refund

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/ingress.yaml
  - web/hpa.yaml
  - web/pdb.yaml
  - jobs/backup-pvc.yaml
  - jobs/migrate.yaml
  - jobs/cronjobs.yaml
