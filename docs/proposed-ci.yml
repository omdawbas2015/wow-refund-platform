name: CI

on:
  push:
    branches:
      - main
      - 'devin/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: v2
        run: pnpm db:generate

      - name: Typecheck (4 packages)
        working-directory: v2
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: v2
        run: pnpm db:generate

      - name: Push schema (sqlite)
        working-directory: v2
        run: pnpm db:push

      - name: Vitest
        working-directory: v2
        run: pnpm --filter @wow/web test

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: v2/apps/web
        run: pnpm test:e2e:install

      - name: Generate Prisma client
        working-directory: v2
        run: pnpm db:generate

      - name: Apply migrations + seed
        working-directory: v2
        run: |
          pnpm db:push
          SEED_DEMO_CASES=1 pnpm db:seed
        env:
          AUTH_SECRET: ci-test-secret-32bytes-of-stringggggggg
          AUTH_TRUST_HOST: 'true'

      - name: Build app
        working-directory: v2/apps/web
        run: pnpm build
        env:
          AUTH_SECRET: ci-test-secret-32bytes-of-stringggggggg
          AUTH_TRUST_HOST: 'true'

      - name: Start app
        working-directory: v2/apps/web
        run: pnpm start &
        env:
          AUTH_SECRET: ci-test-secret-32bytes-of-stringggggggg
          AUTH_TRUST_HOST: 'true'

      - name: Wait for app
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright
        working-directory: v2/apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v2/apps/web/playwright-report
          retention-days: 7
